name: Update Arabic Sports Channels

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone and Setup Scraper
        run: |
          git clone https://github.com/MohamedAmineGrami/iptv-scraper.git scraper_core
          cd scraper_core
          pip install -r requirements.txt || true
          pip install beautifulsoup4 requests termcolor colorama art

      - name: Run Scraper
        run: |
          mkdir -p temp_output
          cd scraper_core
          # تشغيل سكربت السحب لقنوات bein
          python -m iptv_scraper -c "bein sports" -n 8 -o "../temp_output/bein" --auto-save || python main.py -c "bein sports" -n 8 -o "../temp_output/bein" --auto-save || true

      - name: Convert to JSON
        run: |
          python - << 'EOF'
          import os
          import json
          import glob

          channels = []
          files = glob.glob('temp_output/**/*.m3u', recursive=True) + glob.glob('**/*.m3u', recursive=True)

          for fpath in files:
              try:
                  with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                      current_name = None
                      for line in f:
                          line = line.strip()
                          if line.startswith('#EXTINF:'):
                              parts = line.split(',')
                              current_name = parts[-1].strip() if len(parts) > 1 else "beIN Sports"
                          elif line.startswith('http'):
                              channels.append({
                                  "name": current_name or "beIN Sports",
                                  "url": line,
                                  "quality": "HD"
                              })
                              current_name = None
              except Exception:
                  pass

          os.makedirs('public', exist_ok=True)
          with open('public/arabic_channels.json', 'w', encoding='utf-8') as out:
              json.dump(channels, out, ensure_ascii=False, indent=2)

          print(f"Generated {len(channels)} channels.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/arabic_channels.json
          git commit -m "Auto-update beIN sports channels [skip ci]" || echo "No changes"
          git push
