name: Update Arabic Sports Channels

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-channels:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Channels Directly
        run: |
          python - << 'EOF'
          import urllib.request
          import json
          import re
          import os

          headers = {'User-Agent': 'Mozilla/5.0'}
          sources = [
              "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ara.m3u",
              "https://raw.githubusercontent.com/Free-IPTV/Countries/master/Arab_World.m3u"
          ]

          channels = []
          seen = set()

          for src in sources:
              try:
                  req = urllib.request.Request(src, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as res:
                      lines = res.read().decode('utf-8', errors='ignore').split('\n')
                      name = None
                      for line in lines:
                          line = line.strip()
                          if line.startswith('#EXTINF:'):
                              m = re.search(r',(.+)$', line)
                              if m:
                                  name = m.group(1).strip()
                          elif line.startswith('http'):
                              if name and any(k in name.lower() for k in ['sport', 'bein', 'alkass', 'ssc', 'on time']):
                                  if line not in seen:
                                      seen.add(line)
                                      channels.append({
                                          "name": name,
                                          "url": line,
                                          "quality": "HD"
                                      })
                              name = None
              except Exception as e:
                  print(f"Skipping {src}: {e}")

          if not channels:
              channels = [
                  {"name": "beIN Sports News HD", "url": "https://www.youtube.com/embed/live_stream?channel=UCyG_8rD5m7aN2_zI38XfEgw", "quality": "FHD"},
                  {"name": "Alkass One HD", "url": "https://www.alkass.net/alkass/live.aspx?ch=one", "quality": "HD"}
              ]

          os.makedirs('public', exist_ok=True)
          with open('public/arabic_channels.json', 'w', encoding='utf-8') as f:
              json.dump(channels, f, ensure_ascii=False, indent=2)

          print(f"Saved {len(channels)} channels to public/arabic_channels.json")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/arabic_channels.json
          git commit -m "Auto-update arabic channels links [skip ci]" || echo "No changes"
          git push
